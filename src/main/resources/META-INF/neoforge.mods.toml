modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="otcaddon.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="${mod_credits}（由 AI 辅助开发）"
description='''
Order To Cook（下单了）的附属模组。
· 悦灵服务员：每台打单机仅一只，按钮改为雇佣/升级，等级上限等于餐厅等级（最高8级）。
  1级送餐，桌前有脏盘时不送；2级收脏盘；3级使用洗碗池洗碗并把空盘放回餐盘架；4-8级逐级提速。
  首次雇佣100 otc币，之后升级费用逐级翻倍，8级达到此前最高响应与飞行速度。
· 储钱罐：粉色小猪外观，9格只存otc币；摆在打单机周围一格内，收入优先直接入罐，满了再发给玩家。
  打单机升级、改名和悦灵升级可优先调用罐内otc币。
· 立牌菜单快捷添加：打开立牌菜单后，按住 Shift 点击 JEI 里的食物即可加入。
· 缺料一键收藏：打开操作台后，点击右上角的查询按钮，当前订单缺少的菜品会自动钉进 JEI 收藏；
  打包或装盘成功后，本次加进去的收藏会自动撤掉（玩家自己钉的收藏不受影响）。
· 指路箭头：主手拿着打包好的外卖袋时，眼前会浮现一个指向配送点的发光箭头。
· 报错消音：GeckoLib 载入动画时用一个不带容错的循环，只要别的模组有任意一个动画文件解不开，
  循环就静默中断，排在后面的动画整批进不了缓存——Order To Cook 的顾客动画和打单机动画就被挤掉，
  顾客会僵住不动、日志每帧刷一条「Unable to find animation」。
  本附属在资源加载完成后自查一遍动画缓存，把缺掉的文件重新烘焙补回，并在日志出口拦掉这类报错。
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# OrderToCook 本体：最低 1.3.6，已核对该正式版 jar 的调用接口与收付款接入点。
[[dependencies.${mod_id}]]
modId="ordertocook"
type="required"
versionRange="[1.3.6,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19.57.0.449,)"
ordering="AFTER"
side="CLIENT"
